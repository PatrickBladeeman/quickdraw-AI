[build-system]
requires = ["setuptools>=65.5", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdraw-bdq-trainer"
version = "0.3.0"
description = "QuickDraw Branching Double DQN direct LLAPI trainer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mlagents-envs==1.1.0",
  "numpy==1.23.5",
  "torch==2.12.0",
]

[tool.setuptools]
packages = ["quickdraw_bdq"]
