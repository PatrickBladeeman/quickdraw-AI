[build-system]
requires = ["setuptools>=65.5", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdraw-bdq-trainer"
version = "0.2.0"
description = "QuickDraw Branching Double DQN trainer plugin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mlagents==1.1.0",
  "mlagents-envs==1.1.0",
  "numpy==1.23.5",
  "torch==2.12.0",
]

[project.entry-points."mlagents.trainer_type"]
quickdraw_bdq = "quickdraw_bdq.plugin:register_trainer_types"

[tool.setuptools]
packages = ["quickdraw_bdq"]
